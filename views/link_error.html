<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}} — Сократитель ссылок</title>
<style>
  :root{
    --bg:#F7F7F8;
    --surface:#FFFFFF;
    --border:#E1E3E7;
    --text:#1D2027;
    --text-muted:#6B7280;
    --accent:#2563EB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .wrap{max-width:420px;margin:80px auto;padding:0 20px;}
  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:36px 28px;text-align:center;
  }
  .icon{
    width:56px;height:56px;margin:0 auto 18px;border-radius:50%;
    background:#F3F4F6;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
  }
  h1{font-size:19px;margin:0 0 8px;}
  p{color:var(--text-muted);margin:0 0 24px;}
  .btn{
    display:inline-block;padding:10px 20px;border-radius:6px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:600;text-decoration:none;
  }
  .btn:hover{background:#1D4ED8;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.43"/>
        <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.33"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </div>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    <a class="btn" href="/">Создать свою ссылку</a>
  </div>
</div>
</body>
</html>
